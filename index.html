<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University IoT Attendance & Main Gate Dashboard</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-input, .date-input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        .refresh-badge {
            font-size: 0.85rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 16px;
            border: 1px solid #cbd5e1;
            background: #f1f5f9;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        th, td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f3f4f6;
            font-weight: 600;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-full { background-color: #dcfce7; color: #15803d; }
        .status-half { background-color: #fef9c3; color: #a16207; }
        .status-absent { background-color: #fee2e2; color: #b91c1c; }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .legend { display: flex; gap: 15px; font-size: 0.9rem; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 12px; height: 12px; border-radius: 3px; }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-approve { background-color: var(--success); color: white; display: none; }
        .btn-download { background-color: var(--primary); color: white; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white; padding: 25px; border-radius: 10px; width: 320px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group input { width: 93%; padding: 8px; }
        .error-msg { color: var(--danger); font-size: 0.85rem; display: none; margin-bottom: 10px; }
        .no-data { padding: 20px; color: #6b7280; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2 style="margin: 0;">University IoT Attendance & Gate Dashboard</h2>
            <div class="refresh-badge">
                <span class="pulse-dot"></span> Live Sync Active (Polling API every 5s)
            </div>
        </div>
        <div class="header-controls">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Index..." oninput="filterTable()">
            <input type="date" id="datePicker" class="date-input" onchange="handleDateChange()">
            <button class="btn-primary" id="adminBtn" onclick="toggleAdminAuth()">Admin Panel</button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabLecBtn" onclick="switchTab('lecture')">Lecture Hall Attendance</button>
        <button class="tab-btn" id="tabGateBtn" onclick="switchTab('maingate')">Main Gate Access Logs</button>
        <button class="tab-btn" id="tabCardBtn" onclick="switchTab('cards')">Registered RFID Cards</button>
    </div>

    <!-- Lecture Attendance View -->
    <div id="lectureView">
        <table>
            <thead>
                <tr>
                    <th>Index</th>
                    <th>9:00 - 10:00</th>
                    <th>10:30 - 12:00</th>
                    <th>1:00 - 2:30</th>
                    <th>3:00 - 4:00</th>
                    <th>Final Attend</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div class="footer-controls">
            <div class="legend">
                <div class="legend-item"><span class="legend-box" style="background:#dcfce7;"></span> Full Day</div>
                <div class="legend-item"><span class="legend-box" style="background:#fef9c3;"></span> Half Day</div>
                <div class="legend-item"><span class="legend-box" style="background:#fee2e2;"></span> Absent</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-download" onclick="downloadCsvReport()">Download CSV</button>
                <button id="approveBtn" class="btn-approve" onclick="approveAttendance()">Approve Attendance</button>
            </div>
        </div>
    </div>

    <!-- Main Gate Access View -->
    <div id="mainGateView" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th>Index</th>
                    <th>Entry Timestamp</th>
                    <th>Gate Status</th>
                </tr>
            </thead>
            <tbody id="gateTableBody"></tbody>
        </table>
    </div>

    <!-- Registered Cards View -->
    <div id="cardMappingsView" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th>Hardware RFID UID</th>
                    <th>Assigned Student ID</th>
                </tr>
            </thead>
            <tbody id="cardTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginModal">
    <div class="modal">
        <h3>Admin Login</h3>
        <div class="error-msg" id="loginError">Invalid Username or Password</div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="admin">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="handleLogin()">Login</button>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = "https://backend-ten-zeta-42.vercel.app";
    let isAdminLoggedIn = false;
    let isApprovedByAdmin = false;
    let cachedStudents = [];
    let cachedGateEntries = [];
    let cachedCardMappings = [];
    let activeTab = "lecture";

    function getTodayDate() {
        const today = new Date();
        return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    window.onload = () => {
        const today = getTodayDate();
        const datePicker = document.getElementById('datePicker');
        datePicker.value = today;
        datePicker.max = today;
        fetchData();
        setInterval(fetchData, 5000);
    };

    function switchTab(tab) {
        activeTab = tab;
        document.getElementById('tabLecBtn').classList.toggle('active', tab === 'lecture');
        document.getElementById('tabGateBtn').classList.toggle('active', tab === 'maingate');
        document.getElementById('tabCardBtn').classList.toggle('active', tab === 'cards');
        
        document.getElementById('lectureView').style.display = tab === 'lecture' ? 'block' : 'none';
        document.getElementById('mainGateView').style.display = tab === 'maingate' ? 'block' : 'none';
        document.getElementById('cardMappingsView').style.display = tab === 'cards' ? 'block' : 'none';
        
        filterTable();
    }

    function handleDateChange() {
        const datePicker = document.getElementById('datePicker');
        if (datePicker.value > getTodayDate()) {
            alert('Future dates cannot be selected.');
            datePicker.value = getTodayDate();
        }
        fetchData();
    }

    async function fetchData() {
        const selectedDate = document.getElementById('datePicker').value;
        if (!selectedDate) return;

        try {
            const [attendanceRes, approvalRes, gateRes, cardRes] = await Promise.all([
                fetch(`${API_BASE_URL}/getAttend?date=${selectedDate}`),
                fetch(`${API_BASE_URL}/getApprovalStatus?date=${selectedDate}`),
                fetch(`${API_BASE_URL}/getMainGate?date=${selectedDate}`),
                fetch(`${API_BASE_URL}/getCardMappings`)
            ]);

            if (attendanceRes.ok) {
                const json = await attendanceRes.json();
                const attMap = json.data || {};
                cachedStudents = Object.keys(attMap).sort((a,b)=>Number(a)-Number(b)).map(id => {
                    const raw = attMap[id];
                    let lecs = Array.isArray(raw) ? [raw[0]?1:0, raw[1]?1:0, raw[2]?1:0, raw[3]?1:0] : [raw?1:0, raw?1:0, raw?1:0, raw?1:0];
                    return { index: `DCSD261F-${id}`, lec1: lecs[0], lec2: lecs[1], lec3: lecs[2], lec4: lecs[3] };
                });
            }

            if (approvalRes.ok) {
                const appJson = await approvalRes.json();
                isApprovedByAdmin = !!appJson.approved_by_admin;
            }

            if (gateRes.ok) {
                const gateJson = await gateRes.json();
                const gateData = gateJson.data || {};
                cachedGateEntries = [];
                Object.keys(gateData).forEach(studentId => {
                    const logs = gateData[studentId];
                    Object.values(logs).forEach(log => {
                        cachedGateEntries.push({ index: `DCSD261F-${studentId}`, time: log.timestamp, status: log.status });
                    });
                });
            }

            if (cardRes.ok) {
                const cardJson = await cardRes.json();
                const cardData = cardJson.data || {};
                cachedCardMappings = Object.keys(cardData).map(uid => ({
                    uid: uid,
                    student_id: cardData[uid]
                }));
            }

            filterTable();
            updateApproveButtonState();
        } catch (err) {
            console.error('API Fetch Error:', err);
        }
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (activeTab === 'lecture') {
            renderTable(cachedStudents.filter(s => s.index.toLowerCase().includes(query)));
        } else if (activeTab === 'maingate') {
            renderGateTable(cachedGateEntries.filter(g => g.index.toLowerCase().includes(query)));
        } else if (activeTab === 'cards') {
            renderCardTable(cachedCardMappings.filter(c => c.uid.toLowerCase().includes(query) || c.student_id.toLowerCase().includes(query)));
        }
    }

    function renderTable(students) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        if (!students.length) {
            tbody.innerHTML = `<tr><td colspan="6" class="no-data">No matching attendance records found.</td></tr>`;
            return;
        }
        students.forEach(student => {
            const total = student.lec1 + student.lec2 + student.lec3 + student.lec4;
            let badgeClass = total === 4 ? "status-full" : (total >= 2 ? "status-half" : "status-absent");
            let statusText = total === 4 ? "Full Attend" : (total >= 2 ? "Half Day" : "Absent");
            tbody.innerHTML += `
                <tr>
                    <td><strong>${student.index}</strong></td>
                    <td>${student.lec1 ? '✔️' : '❌'}</td>
                    <td>${student.lec2 ? '✔️' : '❌'}</td>
                    <td>${student.lec3 ? '✔️' : '❌'}</td>
                    <td>${student.lec4 ? '✔️' : '❌'}</td>
                    <td><span class="badge ${badgeClass}">${statusText}</span></td>
                </tr>`;
        });
    }

    function renderGateTable(entries) {
        const tbody = document.getElementById('gateTableBody');
        tbody.innerHTML = "";
        if (!entries.length) {
            tbody.innerHTML = `<tr><td colspan="3" class="no-data">No Main Gate scans recorded for this date.</td></tr>`;
            return;
        }
        entries.forEach(entry => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${entry.index}</strong></td>
                    <td>${entry.time}</td>
                    <td><span class="badge status-full">${entry.status}</span></td>
                </tr>`;
        });
    }

    function renderCardTable(cards) {
        const tbody = document.getElementById('cardTableBody');
        tbody.innerHTML = "";
        if (!cards.length) {
            tbody.innerHTML = `<tr><td colspan="2" class="no-data">No registered cards found in database.</td></tr>`;
            return;
        }
        cards.forEach(card => {
            tbody.innerHTML += `
                <tr>
                    <td><code>${card.uid}</code></td>
                    <td><strong>${card.student_id}</strong></td>
                </tr>`;
        });
    }

    function updateApproveButtonState() {
        const approveBtn = document.getElementById('approveBtn');
        if (isAdminLoggedIn) {
            approveBtn.style.display = 'inline-block';
            approveBtn.innerText = isApprovedByAdmin ? 'Already Approved' : 'Approve Attendance';
            approveBtn.disabled = isApprovedByAdmin;
        } else {
            approveBtn.style.display = 'none';
        }
    }

    function toggleAdminAuth() {
        if (isAdminLoggedIn) {
            isAdminLoggedIn = false;
            document.getElementById('adminBtn').innerText = 'Admin Panel';
            updateApproveButtonState();
        } else {
            document.getElementById('loginModal').style.display = 'flex';
        }
    }

    function closeModal() {
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('loginError').style.display = 'none';
    }

    function handleLogin() {
        if (document.getElementById('username').value === 'admin' && document.getElementById('password').value === 'admin') {
            isAdminLoggedIn = true;
            document.getElementById('adminBtn').innerText = 'Logout Admin';
            closeModal();
            updateApproveButtonState();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    async function approveAttendance() {
        const selectedDate = document.getElementById('datePicker').value;
        try {
            const response = await fetch(`${API_BASE_URL}/approveAttend`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: selectedDate, approved: true })
            });
            if (response.ok) {
                alert(`Attendance for ${selectedDate} approved!`);
                fetchData();
            }
        } catch (error) {
            console.error('Approval Error:', error);
        }
    }

    function downloadCsvReport() {
        const selectedDate = document.getElementById('datePicker').value;
        if (!cachedStudents.length) return alert('No data available to export.');
        const headers = ['Date', 'Index', 'Lec 1', 'Lec 2', 'Lec 3', 'Lec 4', 'Total', 'Status', 'Approved'];
        const rows = cachedStudents.map(s => {
            const total = s.lec1 + s.lec2 + s.lec3 + s.lec4;
            const status = total === 4 ? 'Full Attend' : (total >= 2 ? 'Half Day' : 'Absent');
            return [selectedDate, s.index, s.lec1, s.lec2, s.lec3, s.lec4, total, status, isApprovedByAdmin];
        });
        const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `attendance_report_${selectedDate}.csv`;
        link.click();
    }
</script>
</body>
</html>
