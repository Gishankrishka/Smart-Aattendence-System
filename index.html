<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University IoT Attendance Dashboard</title>

    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-input,
        .date-input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        .search-input:focus,
        .date-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .refresh-badge {
            font-size: 0.85rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.7;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f3f4f6;
            font-weight: 600;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-full {
            background-color: #dcfce7;
            color: #15803d;
        }

        .status-half {
            background-color: #fef9c3;
            color: #a16207;
        }

        .status-absent {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .legend {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-box {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-approve {
            background-color: var(--success);
            color: white;
            padding: 10px 20px;
            display: none;
        }

        .btn-approve:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .btn-download {
            background-color: var(--primary);
            color: white;
            padding: 10px 20px;
        }

        .btn-download:hover {
            background-color: var(--primary-hover);
        }

        /* Modal Styles */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .modal h3 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 93%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            display: none;
            margin-bottom: 10px;
        }

        .no-data {
            padding: 20px;
            color: #6b7280;
            font-style: italic;
        }

        /* Responsive */

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header-controls {
                width: 100%;
                flex-wrap: wrap;
            }

            .search-input,
            .date-input {
                flex: 1;
                min-width: 140px;
            }

            table {
                font-size: 0.8rem;
            }

            th,
            td {
                padding: 8px 5px;
            }

            .footer-controls {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <div>
                <h2 style="margin: 0;">
                    Lecture Attendance Dashboard
                </h2>

                <div class="refresh-badge">
                    <span class="pulse-dot"></span>
                    Live Sync Active
                    (Polling http://127.0.0.1:8000 every 5s)
                </div>
            </div>

            <div class="header-controls">

                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="🔍 Search Index..."
                    oninput="filterTable()"
                >

                <!-- Future dates are disabled using max -->
                <input
                    type="date"
                    id="datePicker"
                    class="date-input"
                    onchange="handleDateChange()"
                >

                <button
                    class="btn-primary"
                    id="adminBtn"
                    onclick="toggleAdminAuth()"
                >
                    Admin Panel
                </button>

            </div>
        </div>


        <table>

            <thead>
                <tr>
                    <th>Index</th>
                    <th>9:00 - 10:00</th>
                    <th>10:30 - 12:00</th>
                    <th>1:00 - 2:30</th>
                    <th>3:00 - 4:00</th>
                    <th>Final Attend</th>
                </tr>
            </thead>

            <tbody id="tableBody">
                <!-- Data fetched dynamically -->
            </tbody>

        </table>


        <div class="footer-controls">

            <div class="legend">

                <div class="legend-item">
                    <span
                        class="legend-box"
                        style="background:#dcfce7;"
                    ></span>
                    Full Day
                </div>

                <div class="legend-item">
                    <span
                        class="legend-box"
                        style="background:#fef9c3;"
                    ></span>
                    Half Day
                </div>

                <div class="legend-item">
                    <span
                        class="legend-box"
                        style="background:#fee2e2;"
                    ></span>
                    Absent
                </div>

            </div>


            <div style="display: flex; gap: 10px;">

                <button
                    class="btn-download"
                    onclick="downloadCsvReport()"
                >
                    Download CSV
                </button>

                <button
                    id="approveBtn"
                    class="btn-approve"
                    onclick="approveAttendance()"
                >
                    Approve Attendance
                </button>

            </div>

        </div>

    </div>


    <!-- Login Modal -->

    <div class="modal-overlay" id="loginModal">

        <div class="modal">

            <h3>Admin Login</h3>

            <div
                class="error-msg"
                id="loginError"
            >
                Invalid Username or Password
            </div>

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="admin"
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="admin"
                >

            </div>

            <div
                style="
                    display: flex;
                    justify-content: flex-end;
                    gap: 8px;
                "
            >

                <button onclick="closeModal()">
                    Cancel
                </button>

                <button
                    class="btn-primary"
                    onclick="handleLogin()"
                >
                    Login
                </button>

            </div>

        </div>

    </div>


    <script>

        const API_BASE_URL = "http://127.0.0.1:8000";

        let isAdminLoggedIn = false;
        let isApprovedByAdmin = false;

        // Store raw attendance data for search filtering
        let cachedStudents = [];


        /*
         * Get today's date in YYYY-MM-DD format.
         *
         * Using local time instead of UTC prevents the date
         * from changing unexpectedly around midnight.
         */
        function getTodayDate() {

            const today = new Date();

            const year = today.getFullYear();

            const month = String(
                today.getMonth() + 1
            ).padStart(2, '0');

            const day = String(
                today.getDate()
            ).padStart(2, '0');

            return `${year}-${month}-${day}`;
        }


        /*
         * Page load
         */
        window.onload = () => {

            const today = getTodayDate();

            const datePicker =
                document.getElementById('datePicker');

            /*
             * Set today's date as the default date.
             */
            datePicker.value = today;

            /*
             * IMPORTANT:
             *
             * This prevents the browser calendar from allowing
             * dates after today to be selected.
             */
            datePicker.max = today;

            fetchData();

            /*
             * Refresh attendance every 5 seconds.
             */
            setInterval(fetchData, 5000);
        };


        /*
         * Handle date selection
         */
        function handleDateChange() {

            const datePicker =
                document.getElementById('datePicker');

            const selectedDate = datePicker.value;

            const today = getTodayDate();


            /*
             * Extra protection:
             *
             * If somebody manually enters a future date,
             * reset it back to today.
             */
            if (selectedDate > today) {

                alert(
                    'Future dates cannot be selected.'
                );

                datePicker.value = today;

                fetchData();

                return;
            }


            /*
             * Also make sure max remains today's date.
             */
            datePicker.max = today;

            fetchData();
        }


        /*
         * Fetch attendance data from backend
         */
        async function fetchData() {

            const selectedDate =
                document.getElementById('datePicker').value;

            if (!selectedDate) {
                return;
            }


            /*
             * Extra frontend protection.
             */
            const today = getTodayDate();

            if (selectedDate > today) {

                document.getElementById(
                    'datePicker'
                ).value = today;

                return;
            }


            try {

                const [
                    attendanceRes,
                    approvalRes
                ] = await Promise.all([

                    fetch(
                        `${API_BASE_URL}/getAttend?date=${selectedDate}`
                    ),

                    fetch(
                        `${API_BASE_URL}/getApprovalStatus?date=${selectedDate}`
                    )

                ]);


                if (!attendanceRes.ok) {

                    throw new Error(
                        `Attendance API status: ${attendanceRes.status}`
                    );

                }


                if (!approvalRes.ok) {

                    throw new Error(
                        `Approval API status: ${approvalRes.status}`
                    );

                }


                const jsonResponse =
                    await attendanceRes.json();

                const approvalJson =
                    await approvalRes.json();


                if (jsonResponse.status === "success") {

                    const attendanceMap =
                        jsonResponse.data || {};


                    isApprovedByAdmin =
                        !!approvalJson.approved_by_admin;


                    /*
                     * Convert backend attendance values
                     * into 4 lecture slots per student.
                     */
                    cachedStudents = Object.keys(
                        attendanceMap
                    )
                        .sort(
                            (a, b) =>
                                Number(a) - Number(b)
                        )
                        .map(id => {

                            const rawValue =
                                attendanceMap[id];


                            let lectures =
                                [0, 0, 0, 0];


                            /*
                             * Backend returns:
                             *
                             * [1,0,1,1]
                             *
                             * OR
                             *
                             * true / false
                             */
                            if (
                                Array.isArray(rawValue)
                            ) {

                                lectures = [

                                    rawValue[0]
                                        ? 1
                                        : 0,

                                    rawValue[1]
                                        ? 1
                                        : 0,

                                    rawValue[2]
                                        ? 1
                                        : 0,

                                    rawValue[3]
                                        ? 1
                                        : 0

                                ];

                            } else {

                                const present =
                                    rawValue
                                        ? 1
                                        : 0;

                                lectures = [
                                    present,
                                    present,
                                    present,
                                    present
                                ];

                            }


                            return {

                                index:
                                    `DCSD261F-${id}`,

                                lec1:
                                    lectures[0],

                                lec2:
                                    lectures[1],

                                lec3:
                                    lectures[2],

                                lec4:
                                    lectures[3]

                            };

                        });


                    /*
                     * Render table with search filter.
                     */
                    filterTable();


                    /*
                     * Update approve button.
                     */
                    updateApproveButtonState();

                }

            } catch (error) {

                console.error(
                    'Error fetching data from backend API:',
                    error
                );

            }

        }


        /*
         * Search/filter table
         */
        function filterTable() {

            const query =
                document.getElementById(
                    'searchInput'
                ).value
                .trim()
                .toLowerCase();


            const filtered =
                cachedStudents.filter(
                    student =>
                        student.index
                            .toLowerCase()
                            .includes(query)
                );


            renderTable(filtered);

        }


        /*
         * Render attendance table
         */
        function renderTable(students) {

            const tbody =
                document.getElementById(
                    'tableBody'
                );


            tbody.innerHTML = "";


            if (
                !students ||
                students.length === 0
            ) {

                tbody.innerHTML = `
                    <tr>
                        <td
                            colspan="6"
                            class="no-data"
                        >
                            No matching attendance
                            records found.
                        </td>
                    </tr>
                `;

                return;
            }


            students.forEach(student => {

                const total =
                    student.lec1 +
                    student.lec2 +
                    student.lec3 +
                    student.lec4;


                let badgeClass =
                    "status-absent";

                let statusText =
                    "Absent";


                if (total === 4) {

                    badgeClass =
                        "status-full";

                    statusText =
                        "Full Attend";

                } else if (total >= 2) {

                    badgeClass =
                        "status-half";

                    statusText =
                        "Half Day";

                }


                tbody.innerHTML += `

                    <tr>

                        <td>
                            <strong>
                                ${student.index}
                            </strong>
                        </td>

                        <td>
                            ${student.lec1
                                ? '✔️'
                                : '❌'}
                        </td>

                        <td>
                            ${student.lec2
                                ? '✔️'
                                : '❌'}
                        </td>

                        <td>
                            ${student.lec3
                                ? '✔️'
                                : '❌'}
                        </td>

                        <td>
                            ${student.lec4
                                ? '✔️'
                                : '❌'}
                        </td>

                        <td>
                            <span
                                class="badge ${badgeClass}"
                            >
                                ${statusText}
                            </span>
                        </td>

                    </tr>

                `;

            });

        }


        /*
         * Update approve button
         */
        function updateApproveButtonState() {

            const approveBtn =
                document.getElementById(
                    'approveBtn'
                );


            if (isAdminLoggedIn) {

                approveBtn.style.display =
                    'inline-block';


                if (isApprovedByAdmin) {

                    approveBtn.innerText =
                        'Already Approved';

                    approveBtn.disabled =
                        true;

                } else {

                    approveBtn.innerText =
                        'Approve Attendance';

                    approveBtn.disabled =
                        false;

                }

            } else {

                approveBtn.style.display =
                    'none';

            }

        }


        /*
         * Admin login/logout
         */
        function toggleAdminAuth() {

            if (isAdminLoggedIn) {

                isAdminLoggedIn = false;

                document.getElementById(
                    'adminBtn'
                ).innerText =
                    'Admin Panel';


                updateApproveButtonState();


                alert(
                    'Logged out from Admin Panel'
                );

            } else {

                document.getElementById(
                    'loginModal'
                ).style.display =
                    'flex';

            }

        }


        /*
         * Close login modal
         */
        function closeModal() {

            document.getElementById(
                'loginModal'
            ).style.display =
                'none';


            document.getElementById(
                'loginError'
            ).style.display =
                'none';

        }


        /*
         * Admin login
         */
        function handleLogin() {

            const user =
                document.getElementById(
                    'username'
                ).value;


            const pass =
                document.getElementById(
                    'password'
                ).value;


            if (
                user === 'admin' &&
                pass === 'admin'
            ) {

                isAdminLoggedIn = true;


                document.getElementById(
                    'adminBtn'
                ).innerText =
                    'Logout Admin';


                closeModal();


                updateApproveButtonState();


                document.getElementById(
                    'username'
                ).value = '';


                document.getElementById(
                    'password'
                ).value = '';

            } else {

                document.getElementById(
                    'loginError'
                ).style.display =
                    'block';

            }

        }


        /*
         * Approve attendance
         */
        async function approveAttendance() {

            const selectedDate =
                document.getElementById(
                    'datePicker'
                ).value;


            /*
             * Prevent approving future dates.
             */
            const today = getTodayDate();

            if (selectedDate > today) {

                alert(
                    'Future dates cannot be approved.'
                );

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/approveAttend?date=${selectedDate}`,
                        {
                            method: 'POST'
                        }
                    );


                if (response.ok) {

                    alert(
                        `Attendance for ${selectedDate} successfully approved!`
                    );


                    fetchData();

                } else {

                    alert(
                        'Failed to send approval to server.'
                    );

                }

            } catch (error) {

                console.error(
                    'Error approving attendance:',
                    error
                );


                alert(
                    'Connection error when sending POST request.'
                );

            }

        }


        /*
         * Escape CSV values
         */
        function escapeCsvValue(value) {

            const strValue =
                String(value ?? '');


            if (
                strValue.includes(',') ||
                strValue.includes('"') ||
                strValue.includes('\n')
            ) {

                return `"${strValue.replace(
                    /"/g,
                    '""'
                )}"`;

            }


            return strValue;

        }


        /*
         * Download CSV report
         */
        function downloadCsvReport() {

            const selectedDate =
                document.getElementById(
                    'datePicker'
                ).value;


            const query =
                document.getElementById(
                    'searchInput'
                ).value
                .trim()
                .toLowerCase();


            const studentsToExport =
                cachedStudents.filter(
                    student =>
                        student.index
                            .toLowerCase()
                            .includes(query)
                );


            if (
                !studentsToExport.length
            ) {

                alert(
                    'No attendance data available to export.'
                );

                return;

            }


            const headers = [

                'Date',
                'Index',
                'Lecture 1',
                'Lecture 2',
                'Lecture 3',
                'Lecture 4',
                'Total Present',
                'Final Status',
                'Approved By Admin'

            ];


            const rows =
                studentsToExport.map(
                    student => {

                        const total =
                            student.lec1 +
                            student.lec2 +
                            student.lec3 +
                            student.lec4;


                        const status =
                            total === 4
                                ? 'Full Attend'
                                : (
                                    total >= 2
                                        ? 'Half Day'
                                        : 'Absent'
                                );


                        return [

                            selectedDate,

                            student.index,

                            student.lec1,

                            student.lec2,

                            student.lec3,

                            student.lec4,

                            total,

                            status,

                            isApprovedByAdmin
                                ? 'true'
                                : 'false'

                        ];

                    }
                );


            const csvContent =
                [headers, ...rows]
                    .map(
                        row =>
                            row
                                .map(
                                    escapeCsvValue
                                )
                                .join(',')
                    )
                    .join('\n');


            const blob =
                new Blob(
                    [csvContent],
                    {
                        type:
                            'text/csv;charset=utf-8;'
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement('a');


            link.href = url;


            link.download =
                `attendance_report_${selectedDate || 'unknown-date'}.csv`;


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            URL.revokeObjectURL(url);

        }

    </script>

</body>
</html>
